<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Alignment</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding:20px;
                margin: 8px;
                margin-left: 50px;
            }
            #box, #boxTwo{
                width: 75px;
                height: 75px;
                background-color: blue;
                color:azure;
                text-align: center;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 200px 1fr;
                gap: 5px;
            }
            #flex-wrapper{
                display: none;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
            }
            #duck{
                width: 150px;
            }
            #important{
                text-decoration: underline;
                color: orange;
            }
        </style>
    </head>
    <body>
        <h1>Alignment Notes</h1>
        <img src="https://hotpinkgifts.com/cdn/shop/files/image_6cd8cbfb-a57b-4c41-8284-21cc9ab8fcdc.jpg?v=1743364261" alt="duck" id="duck" onmouseout="changeImage()">
        <div id="box-wrapper">
            <div id="box" onmouseover="dissapear()" onmouseout="appear()">
                <p>Box 1</p>
            </div>
            <div id="boxTwo">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <p>This is a paragraph to show how you can make changes to just a part of a sentnece, <span id="important">or a paragarph</span>, without putting a new paragraph inside of the the paragraph.</p>
        <div id="flex-wrapper">
            <div id="box">
                <p>Box 1</p>
            </div>
            <div id="box">
                <p>Box 2</p>
            </div>
            <div id="box">
                <p>Box 3</p>
            </div>
            <div id="box">
                <p>Box 4</p>
            </div>
        </div>
        <input type="color" id="colorPicker">
        <br>
        <button onClick="color()">Click Me</button>
        <button id="showMore" onclick="show()">Show More</button>
        <script>
            //makes the webpage interactive
            let images = ["https://cdn11.bigcommerce.com/s-t0urwum501/images/stencil/1000x1000/products/8255/12345/116365_sp25-01__81152.1743181430.jpg?c=2", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnRsX2FF-UxMQ5aGEy0ppQokPxFKVoTFRfiekW9Ttvf28ORybyOlc7cOk&s=10", "https://amsterdamduckstore.com/wp-content/uploads/2015/08/spidy-rubber-duck-front-e1569408181344.jpg", "https://hotpinkgifts.com/cdn/shop/files/image_6cd8cbfb-a57b-4c41-8284-21cc9ab8fcdc.jpg?v=1743364261"]
            let current = 0
            function changeImage(){
                current += 1
                if (current > 3){
                    current = 0
                }
                document.getElementById("duck").src = images[current]
            }
            function color(){
                let newColor = document.getElementById("colorPicker").value
                document.getElementById("box").style.backgroundColor = newColor
            }
            function dissapear(){
                document.getElementById("boxTwo").style.display = 'none'
            }
            function appear(){
                document.getElementById("boxTwo").style.display = "block"
            }
            function show(){
                let element = document.getElementById("flex-wrapper")
                if (element.style.display == "flex"){
                    element.style.display = "none"
                    document.getElementById("showMore").innerHTML = "Show More"
                }else{
                    element.style.display = "flex"
                    document.getElementById("showMore").innerHTML = "Show Less"
                }
            }
        </script>
    </body>
</html>
